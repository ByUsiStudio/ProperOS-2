# ProperOS 25.0.0 引导配置
# 延续 ProLoader 2.x 的配置语义，字段名保持兼容
[system]
version   = "2.5"
kernel    = "/boot/vmlinuz-properos-25.0.0"
rootfs    = "ext4"

[boot]
timeout   = 5
default   = 0
splash    = true
# 串口调试，服务器/虚拟机建议 true
serial    = false

[security]
# 严格权限：非系统包不得申请 cap_sys_admin
strict_perm        = true
# 允许安装开发版（未签名）软件包
allow_dev_install  = true
# 超级管理员通道（对应 2.x 的 supan），2.5 由 polkit + sudo 实现
supan              = true
# 安装器是否允许在整盘上无确认执行
require_confirm    = true

[container]
runtime   = "podman"
mode      = "rootful"
cgroup    = "v2"
storage   = "overlay"
network   = "netavark"
# 默认禁止的特权项
allow_privileged = false
