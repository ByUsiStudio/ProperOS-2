set default=0
set timeout=10
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "ProperOS 25.0.0  ·  安装程序 (图形/文本控制台)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 quiet loglevel=4
    initrd /boot/initrd.img
}

menuentry "ProperOS 25.0.0  ·  安装程序 (详细日志)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=7
    initrd /boot/initrd.img
}

menuentry "ProperOS 25.0.0  ·  串口控制台 (ttyS0)" {
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0 loglevel=7
    initrd /boot/initrd.img
}

menuentry "从本地磁盘启动" {
    exit
}
